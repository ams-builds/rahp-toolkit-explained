<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Could this harm real people?</title>
<desc id="desc">You give RAHP your app, agent or specification. RAHP asks which harm it can cause and which evidence shows that a control stops the risk. The result is PASS, FAIL or NOT SURE. Missing evidence never becomes PASS.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#eb6c36"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="460" fill="#f5f5f5"/>
<text x="40" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">Could this harm real people?</text>
<text x="40" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">RAHP: RISK ASSESSMENT AND HARMS PREVENTION</text>
<rect x="40" y="176" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="46" y="182" width="30" height="16" rx="4" fill="#ececec"/>
<text x="61.0" y="194" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="140.0" y="217.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Your app or agent</text>
<text x="140.0" y="230.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">specification, code or change</text>
<line x1="240" y1="208" x2="326" y2="208" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="330" y="160" width="280" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="336" y="166" width="36" height="16" rx="4" fill="#ececec"/>
<text x="354.0" y="178" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">RAHP</text>
<text x="470.0" y="217.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#2d3142">Harm check</text>
<text x="470.0" y="230.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">which harm can it cause?</text>
<line x1="610" y1="208" x2="756" y2="132" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="760" y="104" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="766" y="110" width="30" height="16" rx="4" fill="#ececec"/>
<text x="781.0" y="122" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">OUT</text>
<text x="920.0" y="141.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">PASS</text>
<text x="920.0" y="154.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">evidence supports the claim</text>
<line x1="610" y1="208" x2="756" y2="208" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="760" y="180" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="766" y="186" width="30" height="16" rx="4" fill="#ececec"/>
<text x="781.0" y="198" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">OUT</text>
<text x="920.0" y="217.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">FAIL</text>
<text x="920.0" y="230.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">evidence shows a problem</text>
<line x1="610" y1="208" x2="756" y2="284" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="760" y="256" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="766" y="262" width="30" height="16" rx="4" fill="#ececec"/>
<text x="781.0" y="274" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">OUT</text>
<text x="920.0" y="293.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">NOT SURE</text>
<text x="920.0" y="306.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">evidence is missing</text>
<text x="760" y="352" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" font-weight="600" letter-spacing="0.06em" fill="#7a8399">MISSING EVIDENCE NEVER BECOMES PASS.</text>
<line x1="40" y1="376" x2="1160" y2="376" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="40" y="402" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">WHO</text>
<rect x="120" y="392" width="30" height="16" rx="4" fill="#ececec"/>
<text x="135.0" y="404" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="160" y="404" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">what you supply</text>
<rect x="380" y="392" width="36" height="16" rx="4" fill="#ececec"/>
<text x="398.0" y="404" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">RAHP</text>
<text x="426" y="404" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">what the method does</text>
<rect x="640" y="392" width="30" height="16" rx="4" fill="#ececec"/>
<text x="655.0" y="404" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">OUT</text>
<text x="680" y="404" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">one possible result</text>
</svg>
