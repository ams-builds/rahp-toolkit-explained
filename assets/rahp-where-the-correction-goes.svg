<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Where the correction goes</title>
<desc id="desc">A finding goes to one primary place: the specification, the code, a missing test or evidence, an operator control, governance and redress, or the user experience. Select the smallest control plane that has the authority and a path to evidence.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#eb6c36"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="500" fill="#f5f5f5"/>
<text x="40" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">Where the correction goes</text>
<text x="40" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">NOT ALL PROBLEMS ARE CODE CHANGES.</text>
<rect x="40" y="214" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="46" y="220" width="24" height="16" rx="4" fill="#ececec"/>
<text x="58.0" y="232" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">AI</text>
<text x="130.0" y="255.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Finding</text>
<text x="130.0" y="268.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">a problem with evidence</text>
<line x1="220" y1="246" x2="296" y2="246" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="300" y="198" width="260" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="306" y="204" width="30" height="16" rx="4" fill="#ececec"/>
<text x="321.0" y="216" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="430.0" y="255.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Select the control plane</text>
<text x="430.0" y="268.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">smallest, with authority and evidence</text>
<line x1="560" y1="246" x2="716" y2="116" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="720" y="96" width="360" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="900.0" y="114.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Specification</text>
<text x="900.0" y="127.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">the requirements your app obeys</text>
<line x1="560" y1="246" x2="716" y2="168" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="720" y="148" width="360" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="900.0" y="166.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Code</text>
<text x="900.0" y="179.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">a change to the app</text>
<line x1="560" y1="246" x2="716" y2="220" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="720" y="200" width="360" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="900.0" y="218.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Test or evidence</text>
<text x="900.0" y="231.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">add the missing evidence</text>
<line x1="560" y1="246" x2="716" y2="272" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="720" y="252" width="360" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="900.0" y="270.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Operator control</text>
<text x="900.0" y="283.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">a check when the app operates</text>
<line x1="560" y1="246" x2="716" y2="324" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="720" y="304" width="360" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="900.0" y="322.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Governance and redress</text>
<text x="900.0" y="335.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">decisions, and how to correct them</text>
<line x1="560" y1="246" x2="716" y2="376" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="720" y="356" width="360" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="900.0" y="374.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2d3142">User experience</text>
<text x="900.0" y="387.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">what persons see and select</text>
<text x="300" y="330" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" font-weight="600" letter-spacing="0.06em" fill="#7a8399">ONE PRIMARY CONTROL PLANE FOR EACH FINDING.</text>
<line x1="40" y1="420" x2="1160" y2="420" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="40" y="446" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">WHO</text>
<rect x="120" y="436" width="24" height="16" rx="4" fill="#ececec"/>
<text x="132.0" y="448" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">AI</text>
<text x="154" y="448" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">Claude can prepare the finding</text>
<rect x="440" y="436" width="30" height="16" rx="4" fill="#ececec"/>
<text x="455.0" y="448" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="480" y="448" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">you select the control plane</text>
</svg>
